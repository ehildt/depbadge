# yaml-language-server: $schema=./depbadgerc.schema.json
integrity: a6421d83625bc5018b316a214f8203076692e3c1a0328db9fdcf08fae728dada
target: README.md
manifest: package.json
output:
  - markdown

dependenciesLayout: &DEPENDENCIES_LAYOUT
  position: center
  showHeader: false

dependenciesStyle: &DEPENDENCIES_STYLE
  labelColor: '333'
  isError: false
  namedLogo: npm
  logoWidth: 40
  style: for-the-badge
  cacheSeconds: 3600

statusBadgesStyle: &STATUS_BADGES_STYLE   
  labelColor: '333'
  isError: false
  namedLogo: npm
  logoWidth: 40
  style: for-the-badge
  cacheSeconds: 3600

dependencies:
  layout: *DEPENDENCIES_LAYOUT
  badgeStyle: *DEPENDENCIES_STYLE
  items:
    - name: colord
      namedLogo: npm
      link: https://github.com/omgovich/colord
    - name: js-yaml
      namedLogo: npm
      link: https://github.com/nodeca/js-yaml
    - name: "@iarna/toml"
      namedLogo: toml
      link: https://github.com/iarna/iarna-toml
    - name: yargs
      namedLogo: freebsd
      link: https://github.com/yargs/yargs

devDependencies:
  layout:  *DEPENDENCIES_LAYOUT
  badgeStyle: 
    <<: *DEPENDENCIES_STYLE
    style: flat-square
  items:
    - name: '@changesets/cli'
      namedLogo: npm
    - name: '@eslint/js'
      namedLogo: eslint
    - name: '@types/eslint'
      namedLogo: eslint
    - name: '@types/node'
      namedLogo: node
    - name: depcheck
      namedLogo: npm
    - name: dependency-cruiser
      namedLogo: npm
    - name: dotenv-cli
      namedLogo: npm
    - name: eslint
      namedLogo: eslint
    - name: eslint-config-prettier
      namedLogo: prettier
    - name: eslint-plugin-prettier
      namedLogo: prettier
    - name: eslint-plugin-simple-import-sort
      namedLogo: npm
    - name: eslint-plugin-sonarjs
      namedLogo: sonar
    - name: globals
      namedLogo: npm
    - name: husky
      namedLogo: husky
    - name: "vitest"
      namedLogo: vitest
    - name: "@vitest/coverage-v8"
      namedLogo: vitest
    - name: jiti
      namedLogo: npm
    - name: lint-staged
      namedLogo: npm
    - name: npm-check-updates
      namedLogo: npm
    - name: rimraf
      namedLogo: npm
    - name: source-map-support
      namedLogo: npm
    - name: ts-loader
      namedLogo: npm
    - name: ts-node
      namedLogo: npm
    - name: ts-unused-exports
      namedLogo: npm
    - name: typescript
      namedLogo: typescript
    - name: typescript-eslint
      namedLogo: eslint
    - name: "@types/yargs"
      namedLogo: freebsd

statusBadges:
  layout:
    position: center
    showHeader: false
  badgeStyle: *STATUS_BADGES_STYLE
  items:
    - name: github
      metric: release
      user: ehildt
      repo: depbadge
      branch: main
      namedLogo: github
    - name: github
      metric: stars
      user: ehildt
      repo: depbadge
      branch: main
      namedLogo: github
    - name: github
      metric: license
      user: ehildt
      repo: depbadge
      branch: main
      namedLogo: github
    - name: codecov
      user: ehildt
      repo: depbadge
      branch: main
      flag: c
      link: https://about.codecov.io/
    - name: tile
      message: 🍪🍪🍪
      label: My favorite
      color: '777'
      link: https://sallysbakingaddiction.com/chewy-chocolate-chip-cookies/