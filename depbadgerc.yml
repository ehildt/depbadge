# yaml-language-server: $schema=./depbadgerc.schema.json
integrity: f68b5a3919ea4e91d0a34e85d96cdcbb25bd5d56cd79935bb1f35c632fa1cd27
target: README.md
manifest: package.json
output:
  - markdown

dependenciesLayout: &DEPENDENCIES_LAYOUT
  position: center
  showHeader: false

dependenciesStyle: &DEPENDENCIES_STYLE
  labelColor: "333"
  isError: false
  namedLogo: npm
  logoWidth: 40
  style: for-the-badge
  cacheSeconds: 3600

statusBadgesStyle: &STATUS_BADGES_STYLE
  labelColor: "333"
  isError: false
  namedLogo: npm
  logoWidth: 40
  style: for-the-badge
  cacheSeconds: 3600

dependencies:
  layout: *DEPENDENCIES_LAYOUT
  badgeStyle: *DEPENDENCIES_STYLE
  items:
    - name: colord
      namedLogo: npm
      link: https://github.com/omgovich/colord
    - name: "@iarna/toml"
      namedLogo: toml
      link: https://github.com/iarna/iarna-toml
    - name: yaml 
      namedLogo: npm 
      link: https://github.com/eemeli/yaml

devDependencies:
  layout: *DEPENDENCIES_LAYOUT
  badgeStyle:
    <<: *DEPENDENCIES_STYLE
    style: flat-square
    # labelColor: "333"
  items:
    - name: "@changesets/cli"
      namedLogo: npm
    - name: "@eslint/js"
      namedLogo: eslint
    - name: "@types/eslint"
      namedLogo: eslint
    - name: "@types/node"
      namedLogo: node
    - name: depcheck
      namedLogo: npm
    - name: dependency-cruiser
      namedLogo: npm
    - name: dotenv-cli
      namedLogo: npm
    - name: eslint
      namedLogo: eslint
    - name: eslint-config-prettier
      namedLogo: prettier
    - name: eslint-plugin-prettier
      namedLogo: prettier
    - name: eslint-plugin-simple-import-sort
      namedLogo: npm
    - name: eslint-plugin-sonarjs
      namedLogo: sonar
    - name: globals
      namedLogo: npm
    - name: husky
      namedLogo: husky
    - name: "vitest"
      namedLogo: vitest
    - name: "@vitest/coverage-v8"
      namedLogo: vitest
    - name: jiti
      namedLogo: npm
    - name: lint-staged
      namedLogo: npm
    - name: npm-check-updates
      namedLogo: npm
    - name: rimraf
      namedLogo: npm
    - name: source-map-support
      namedLogo: npm
    - name: ts-loader
      namedLogo: npm
    - name: ts-node
      namedLogo: npm
    - name: ts-unused-exports
      namedLogo: npm
    - name: typescript
      namedLogo: typescript
    - name: typescript-eslint
      namedLogo: eslint

statusBadges:
  layout:
    position: center
    showHeader: false
  badgeStyle: *STATUS_BADGES_STYLE
  items:
    - name: tile
      message: NPM
      label: depbadge
      namedLogo: npm
      link: https://www.npmjs.com/package/@ehildt/depbadge
    - name: github
      metric: release
      user: ehildt
      repo: depbadge
      branch: main
      namedLogo: github
    - name: github
      metric: stars
      user: ehildt
      repo: depbadge
      branch: main
      namedLogo: github
    - name: github
      metric: license
      user: ehildt
      repo: depbadge
      branch: main
      namedLogo: github
    - name: codecov
      user: ehildt
      repo: depbadge
      branch: main
      flag: c
      link: https://about.codecov.io/
    - name: tile
      message: 🍪🍪🍪
      label: My favorite
      color: "777"
      link: https://sallysbakingaddiction.com/chewy-chocolate-chip-cookies/
